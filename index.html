<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =====================================================
         PRIMARY SEO
    ====================================================== -->

    <title>
      Buddy Fleets | Fleet Management Software for Transport Businesses
    </title>

    <meta
      name="description"
      content="Buddy Fleets is a cloud-based fleet management software for transport businesses to manage vehicles, drivers, trips, dispatch, LR/Bilty, expenses, diesel, maintenance, compliance, documents and fleet reports from one platform."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="author"
      content="Buddy Computers"
    />

    <meta
      name="application-name"
      content="Buddy Fleets"
    />

    <!-- =====================================================
         FAVICON

         PNG is primary.
         SVG kept as browser fallback.
    ====================================================== -->

    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/favicon.png"
    />

    <link
      rel="shortcut icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- =====================================================
         THEME COLOR
    ====================================================== -->

    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#050914"
    />

    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#F8FBFF"
    />

    <!-- =====================================================
         HOME HERO / LCP PRELOAD

         Must stay synchronized with Home.jsx.

         Local images:
         /images/truck-400.webp
         /images/truck-640.webp
    ====================================================== -->

    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/truck-400.webp"
      imagesrcset="
        /images/truck-400.webp 400w,
        /images/truck-640.webp 640w
      "
      imagesizes="
        (max-width: 640px) 92vw,
        (max-width: 1024px) 520px,
        500px
      "
      fetchpriority="high"
    />

    <!-- =====================================================
         OPEN GRAPH
    ====================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Buddy Fleets"
    />

    <meta
      property="og:title"
      content="Buddy Fleets | Fleet Management Software for Transport Businesses"
    />

    <meta
      property="og:description"
      content="Manage vehicles, drivers, trips, dispatch, LR/Bilty, expenses, diesel, maintenance, compliance, documents and transport operations from one cloud-based fleet management platform."
    />

    <!-- =====================================================
         TWITTER / SOCIAL PREVIEW
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Buddy Fleets | Fleet Management Software"
    />

    <meta
      name="twitter:description"
      content="Cloud-based fleet management software for transport businesses to manage vehicles, drivers, trips, expenses, maintenance, compliance and operations."
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
